[project]
name = "rubick"
version = "0.1.0"
description = "Unified single-model AI gateway for Chat, Embeddings, Decisions, and Safety Guardrails"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Victor Hugo", email = "victor.panisa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rubick = "rubick:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
